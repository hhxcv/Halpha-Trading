# Non-secret shape example only. Synthetic SIDs and unprovisioned references make
# this file unsuitable for deployment; config/halpha.toml is the Demo release input.
schema_version = 2

[release]
environment_id = "binance-demo-primary"
account_id = "binance-usdm-demo-owner-primary"
venue_account_type = "USDM_DEMO"
profile = "BINANCE_DEMO"
authority_class = "DEMO_VALIDATION"
database_name = "halpha_demo"

[app]
bind = "127.0.0.1"
port = 8765
workers = 1
reload = false
database_role_name = "halpha_demo_app"
# public_market_proxy_url = "http://127.0.0.1:7897" # optional loopback-only route

[[app.trading_contexts]]
venue_account_type = "USDM_DEMO"
environment_id = "binance-demo-primary"
account_id = "binance-usdm-demo-owner-primary"
url = "http://127.0.0.1:8765"

[[app.trading_contexts]]
venue_account_type = "USDM_COPY_LEAD"
environment_id = "binance-live-copy-primary"
account_id = "binance-usdm-copy-lead-primary"
url = "http://127.0.0.1:8766"

[[app.trading_contexts]]
venue_account_type = "USDM_PERSONAL"
environment_id = "binance-live-personal-primary"
account_id = "binance-usdm-personal-primary"
url = "http://127.0.0.1:8767"

[app.database_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_DEMO/App"
account = "scram_password"

[app.csrf_signing_reference]
service = "Halpha/Web/BINANCE_DEMO"
account = "csrf_signing"

[app.smtp_credential_reference]
service = "Halpha/SMTP/BINANCE_DEMO"
account = "password"

[executor]
mutex_name = "Global\\Halpha.Executor.BINANCE_DEMO.WriteOwner"

[executor.database_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_DEMO/Executor"
account = "scram_password"

[executor.binance_api_key_reference]
service = "Halpha/Binance/BINANCE_DEMO"
account = "api_key"

[executor.binance_api_secret_reference]
service = "Halpha/Binance/BINANCE_DEMO"
account = "api_secret"

[maintenance]
postgresql_bin_directory = "C:/Program Files/PostgreSQL/17/bin"
log_root = "logs"
backup_root = "backups/postgresql"
temporary_root = "tmp/backup"
backup_retention_count = 14
backup_schedule_local = "02:30"

[maintenance.demo]
environment_kind = "DEMO"
venue_account_type = "USDM_DEMO"
database_name = "halpha_demo"
backup_role_name = "halpha_demo_backup"
migration_role_name = "halpha_demo_migration"

[maintenance.demo.backup_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_DEMO/Backup"
account = "scram_password"

[maintenance.demo.migration_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_DEMO/Migration"
account = "scram_password"

[maintenance.live_copy]
environment_kind = "LIVE"
venue_account_type = "USDM_COPY_LEAD"
database_name = "halpha_live_copy"
backup_role_name = "halpha_live_copy_backup"
migration_role_name = "halpha_live_copy_migration"

[maintenance.live_copy.backup_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_LIVE_COPY/Backup"
account = "scram_password"

[maintenance.live_copy.migration_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_LIVE_COPY/Migration"
account = "scram_password"

[maintenance.live_personal]
environment_kind = "LIVE"
venue_account_type = "USDM_PERSONAL"
database_name = "halpha_live_personal"
backup_role_name = "halpha_live_personal_backup"
migration_role_name = "halpha_live_personal_migration"

[maintenance.live_personal.backup_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_LIVE_PERSONAL/Backup"
account = "scram_password"

[maintenance.live_personal.migration_credential_reference]
service = "Halpha/PostgreSQL/BINANCE_LIVE_PERSONAL/Migration"
account = "scram_password"

[email]
delivery_enabled = false
smtp_port = 587
require_starttls = true
timeout_seconds = 10

[new_risk_discipline]
max_plan_loss_fraction = "0.0075"
max_open_risk_fraction = "0.025"
max_gross_exposure_fraction = "2"
max_instrument_exposure_fraction = "1"
max_correlated_exposure_fraction = "1.5"
daily_loss_stop_fraction = "0.015"
weekly_loss_stop_fraction = "0.04"
rolling_drawdown_stop_fraction = "0.1"
rolling_drawdown_lookback_days = 30
account_snapshot_max_age_seconds = 65

[windows]
app_task_sid = "S-1-5-21-0-0-0-1101"
executor_task_sid = "S-1-5-21-0-0-0-1102"
backup_task_sid = "S-1-5-21-0-0-0-1104"
maintenance_sid = "S-1-5-21-0-0-0-1103"
app_stop_event = "Global\\Halpha.App.BINANCE_DEMO.Stop"
executor_stop_event = "Global\\Halpha.Executor.BINANCE_DEMO.Stop"
