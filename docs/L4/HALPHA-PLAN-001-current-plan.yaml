current_strategy:
  strategy_id: one_shot
  selection_rule: 只使用当前策略注册表中可验证、可固定并可由当前消费者解释的版本
  boundary: 策略定义产品能力，不记录仓库外实例事实

current_iteration:
  focus: 消除 AI 审核把草稿旧证据截止点与当前行情混用而产生的非技术性拒绝，并明确区分 AI 结论、系统失败和审核依据过期
  result: >-
    每次 AI 审核先由服务端采集当前公开行情和纪律，再在同一事务中把本次市场截止点写入草稿并创建精确审核身份；
    审核输入含连续 1 分钟、15 分钟和 4 小时行情窗口，提示词不得把系统重绑后的截止点当作用户的过期理由。
    当前实现把批准市场依据有效期固定为 5 分钟；到期后的历史批准仍可读，但提交并启动以 PLAN_AI_REVIEW_EXPIRED 拒绝，界面明确显示为非 AI 拒绝。
    已完成后端、前端构建和审核输入单元验证；Demo 端到端审核与提交验证仍在进行，不把仓库外运行结果写成本文件事实。

real_account_trading:
  design_owner: docs/L3/HALPHA-ENG-002-real-trade-core-technology-stack-and-build-boundaries.zh-CN.md
