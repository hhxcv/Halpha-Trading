document_id: HALPHA-PLAN-001
level: L4
language: zh-CN
as_of: 2026-08-14

current_summary: >-
  Halpha 当前产品契约提供 Demo、带单员公域合约实盘和个人合约实盘三个固定且隔离的交易上下文，
  复用计划、资金、执行和复盘语义，并通过显式配置选择上下文与运行模式。Git 只记录产品契约、
  非秘密配置形状和验证结论；仓库外事实及其派生制品不记录于此。
  当前计划不授权真实账户交易所变更请求。

current_product_boundary:
  outcome: >-
    支持计划草稿配置、一次提交并启动、持续监控、动作执行、保护、退出、核对、复盘和用户接管的产品闭环。
  includes:
    - DEMO 产品闭环
    - LIVE_READ_ONLY 公开观察与隔离的私有账户观察形状
    - LIVE_WRITE 的失败关闭实现、安全反例和显式授权边界
    - Demo、带单员公域合约账户和个人合约账户三个固定交易上下文
    - 本地交易工作台与程序化计划接口共用的计划 schema 和领域路径
    - Windows 本地运行、通知、备份恢复和官方入口接管的产品契约
  excludes:
    - 仓库外事实、材料及其派生制品
    - 动态账户接入、跨账户组合、自动扩大资金范围、多场所和机构治理能力
    - 独立 Research 与 Monitor 仓库的实现、依赖、数据和生命周期

current_decisions:
  development_flow: CONTINUOUS_SMALL_ITERATIONS
  iteration_rule: 每次围绕一个可验证的小结果完成必要设计、实现、验证和修复
  capital_authority: 用户固定的单计划资金边界不因激活、历史结果或外部绩效目标自动扩大
  account_risk_discipline: >-
    Demo、LIVE_READ_ONLY 与 LIVE_WRITE 使用同一账户级新增风险判定器；不按每日订单数或并发数限制，
    而按单计划与组合最坏损失、总/单品种/相关簇敞口、可靠日/周亏损停止和滚动回撤限制。
    当前共享上限为单计划最大允许损失 0.75%、未闭合计划最坏损失 2.5%、总/单品种/相关簇敞口为纪律权益的
    2/1/1.5 倍、日/周可靠已闭合亏损停止 1.5%/4%、30 日滚动回撤停止 10%。
    所有上下文使用同一代码拥有的上限，配置只能进一步收窄；Demo 测试直接覆盖实盘所用的同一判定器和执行前复核。
    同品种同向非零浮亏持仓禁止普通新增风险加仓；只有本激活已有成交、冻结多档订单快照可精确还原的原始档位可以继续，
    重试、改价、单档或任何无法还原的动作不例外。
  context_isolation: 环境、账户类型、账户标识、数据库、运行身份、凭据命名空间和写门按交易上下文隔离
  build_identity: 每组产品运行输入只使用一个 product_build_id
  publication_boundary: EXTERNAL_FACTS_NOT_RECORDED
  publication_guard: GITIGNORE_AND_PUBLICATION_HOOK

current_facts:
  source:
    repository: 当前 Git 工作区
    checked_at: 2026-08-14
  evidence_limit: >-
    仓库验证只能证明当前代码和非秘密配置形状；本文件不把仓库外状态表述为 Git 当前事实，
    也不从历史提交推断这些状态。
  product_contract:
    trading_contexts:
      - USDM_DEMO
      - USDM_COPY_LEAD
      - USDM_PERSONAL
    runtime_modes:
      - DEMO
      - LIVE_READ_ONLY
      - LIVE_WRITE
    plan_lifecycle:
      - DRAFT
      - RUNNING
      - ENDED
    programmatic_plan_api: 与工作台共用完整 schema、领域路由和草稿至提交并启动链路
  external_facts:
    repository_status: NOT_RECORDED
    source_of_truth: 各权威外部边界

component_sources:
  design:
    - docs/L1
    - docs/L2
    - docs/L3
  implementation:
    - src/halpha
    - frontend/src
    - config
  validation:
    - tests
